<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math 201</title>
    <script>
        (function() {
            var t = 'light';
            try {
                var p = new URLSearchParams(window.location.search);
                var q = p.get('theme') || p.get('paper');
                if (q === 'dark' || q === 'light') {
                    t = q;
                } else if (localStorage.getItem('math201_theme') === 'dark' || localStorage.getItem('math201_paper_theme') === 'dark') {
                    t = 'dark';
                }
            } catch(e) {}
            document.documentElement.setAttribute('data-theme', t);
        })();
        (function() {
            try {
                if (localStorage.getItem('math201_device_auth') === 'pass') {
                    var params = new URLSearchParams(window.location.search);
                    var dest = params.get('dest') || 'index.html';
                    window.location.replace(dest);
                }
            } catch(e) {}
        })();
    </script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        :root,
        :root[data-theme="light"],
        [data-theme="light"] {
            --bg-body: #f8f8f7;
            --bg-card: #ffffff;
            --bg-subtle: #f1f1ef;
            --border-subtle: #e4e4e7;
            --border-strong: #d4d4d8;
            --text-primary: #18181b;
            --text-secondary: #52525b;
            --text-muted: #71717a;
            --border-focus: #18181b;
            --status-err: #b91c1c;
            --status-err-bg: rgba(185, 28, 28, 0.08);
            --status-err-border: rgba(185, 28, 28, 0.3);
        }
        :root[data-theme="dark"],
        [data-theme="dark"] {
            --bg-body: #0a0a0b;
            --bg-card: #121214;
            --bg-subtle: #18181b;
            --border-subtle: #27272a;
            --border-strong: #3f3f46;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border-focus: #a1a1aa;
            --status-err: #ef4444;
            --status-err-bg: rgba(239, 68, 68, 0.1);
            --status-err-border: rgba(239, 68, 68, 0.35);
        }
        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-inline: 20px;
            padding-block: 20px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .gate-form {
            inline-size: 100%;
            max-inline-size: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .input-wrap {
            position: relative;
            inline-size: 100%;
        }
        .gate-input {
            inline-size: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding-block: 14px;
            padding-inline-start: 16px;
            padding-inline-end: 46px;
            color: var(--text-primary);
            font-size: 16px;
            letter-spacing: 0.04em;
            outline: none;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }
        .gate-input::placeholder {
            color: var(--text-muted);
            letter-spacing: normal;
        }
        .gate-input:focus {
            border-color: var(--border-focus);
            background: var(--bg-card);
        }
        .gate-submit {
            position: absolute;
            inset-inline-end: 8px;
            inset-block-start: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-muted);
            inline-size: 32px;
            block-size: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: color 0.15s ease, background-color 0.15s ease;
        }
        .gate-submit:hover {
            color: var(--text-primary);
            background: var(--bg-subtle);
        }
        .gate-error {
            font-size: 13px;
            color: var(--status-err);
            display: none;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake {
            animation: shake 0.35s ease;
            border-color: var(--status-err) !important;
        }
    </style>
</head>
<body>
    <form class="gate-form" onsubmit="handleLogin(event)" autocomplete="off">
        <div class="input-wrap">
            <input 
                type="text" 
                id="gateKeyInput" 
                class="gate-input" 
                autocomplete="off" 
                autocorrect="off" 
                autocapitalize="off" 
                spellcheck="false" 
                autofocus 
                required 
            />
            <button type="submit" class="gate-submit" aria-label="Unlock" title="Unlock">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </div>
    </form>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            var inp = document.getElementById('gateKeyInput');
            var val = (inp.value || '').trim().toLowerCase();
            if (val === 'pass') {
                try {
                    localStorage.setItem('math201_device_auth', 'pass');
                } catch(e) {}
                var params = new URLSearchParams(window.location.search);
                var dest = params.get('dest') || 'index.html';
                window.location.replace(dest);
            } else {
                inp.classList.add('shake');
                inp.value = '';
                setTimeout(function() { inp.classList.remove('shake'); }, 400);
            }
        }
    </script>
</body>
</html>\n
